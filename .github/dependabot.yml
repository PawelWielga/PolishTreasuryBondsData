version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
