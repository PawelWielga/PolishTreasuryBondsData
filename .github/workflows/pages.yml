name: Publish immutable datasets

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'publication/**'
      - 'requirements.in'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Verify complete immutable snapshot archive against reviewed Git history
        run: python scripts/check_immutable_snapshots.py
      - name: Protect reviewed immutable snapshots before push deployment
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_immutable_snapshots.py --base "${{ github.event.before }}"
      - name: Validate tests and rebuild Pages tree from reviewed main
        run: |
          python -m unittest discover -s tests -v
          python scripts/update.py --offline
          python scripts/check_generated_tree.py
      - name: Derive mutable source freshness from durable last-success timestamps
        run: python scripts/status.py
      - name: Assemble consumer site including public JSON Schemas
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/schemas
          cp -a publication/. _site/
          cp -a schemas/*.json _site/schemas/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy reviewed immutable snapshot and runtime health
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke-test the deployed consumer contract
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/smoke_pages.py --base-url "$PAGES_URL"
