name: Publish immutable datasets

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'publication/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate tests and rebuild Pages tree from reviewed main
        run: |
          python -m unittest discover -s tests -v
          python scripts/update.py --offline --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publication
      - name: Deploy reviewed immutable snapshot
        id: deployment
        uses: actions/deploy-pages@v4
