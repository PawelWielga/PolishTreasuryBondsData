name: Propose official data update

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-official-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Fetch and cross-check MF, GUS and NBP
        run: python scripts/update.py
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Build pull request summary
        run: python scripts/change_summary.py > /tmp/update-pr-body.md
      - name: Create or update one reviewed data pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/update-data
          delete-branch: true
          commit-message: Update verified official Treasury Bond data
          title: Update verified official Treasury Bond data
          body-path: /tmp/update-pr-body.md
          labels: data-update
          add-paths: |
            data
            dist
            publication
