name: Update official data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update catalog from official Ministry of Finance pages
        run: python scripts/update.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No verified data changes."
            exit 0
          fi
          git config user.name "polish-treasury-bonds-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series/catalog-source.json dist/
          git commit -m "Update verified Treasury Bond data"
          git push
