name: Propose official data update

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-official-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and cross-check MF, GUS and NBP
        run: python scripts/update.py
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Build pull request summary
        run: python scripts/change_summary.py > /tmp/update-pr-body.md
      - name: Create or update one reviewed data pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-data
          delete-branch: true
          commit-message: Update verified official Treasury Bond data
          title: Update verified official Treasury Bond data
          body-path: /tmp/update-pr-body.md
          labels: data-update
          add-paths: |
            data
            dist
            publication
