name: Validate data

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild and validate distributions
        run: python scripts/update.py --offline
      - name: Require committed public datasets to be reproducible
        run: git diff --exit-code -- dist/catalog-v1.json dist/reference-data-v1.json
