name: Validate data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Run invariant and parser tests
        run: python -m unittest discover -s tests -v
      - name: Protect immutable publication namespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_immutable_snapshots.py --base "${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_immutable_snapshots.py --base "${{ github.event.before }}"
          else
            python scripts/check_immutable_snapshots.py
          fi
      - name: Rebuild publication deterministically
        run: python scripts/update.py --offline --check
