name: Validate data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run offline parser and publication tests
        run: python -m unittest discover -s tests -v
      - name: Require normalized sources and public aggregates to be reproducible
        run: python scripts/update.py --offline --check
