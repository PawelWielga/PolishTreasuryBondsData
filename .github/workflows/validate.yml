name: Validate data

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Preserve committed public datasets
        run: |
          cp dist/catalog-v1.json /tmp/catalog-v1.committed.json
          cp dist/reference-data-v1.json /tmp/reference-data-v1.committed.json
      - name: Rebuild and validate distributions
        run: python scripts/update.py --offline
      - name: Require committed public datasets to be reproducible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = [
              (Path('/tmp/catalog-v1.committed.json'), Path('dist/catalog-v1.json')),
              (Path('/tmp/reference-data-v1.committed.json'), Path('dist/reference-data-v1.json')),
          ]
          for committed, rebuilt in pairs:
              if json.loads(committed.read_text(encoding='utf-8-sig')) != json.loads(rebuilt.read_text(encoding='utf-8-sig')):
                  raise SystemExit(f'{rebuilt} is stale; rebuild and commit the public dataset')
          PY
